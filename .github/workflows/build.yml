name: Build and publish basemap

on:
  # Publish whatever lands on main. Anything merged here can change the output —
  # a bbox, a zoom, a colour, a pinned tool version — and leaving that to the
  # monthly cron means the site silently lags the source until someone
  # remembers to dispatch a run by hand.
  push:
    branches: [main]
    # Except documentation, which cannot change a tile.
    paths-ignore:
      - "**.md"
      - LICENSE

  workflow_dispatch:
  schedule:
    # Daily at 07:00 UTC. Protomaps rebuilds the planet every day from OSM
    # minutely replication — the build this pulls from carries OSM data to
    # about 04:00 UTC the same day — so a daily run means an OSM edit reaches
    # the app roughly a day later. 07:00 leaves the upstream build a few hours
    # to publish. A run costs well under a minute, and the force-push keeps
    # gh-pages at a single commit however often it happens.
    - cron: "0 7 * * *"
  # Dry run on every PR: build and check the output, publish nothing. Without
  # this the workflow could only be exercised by merging it, and three separate
  # bugs in it were found that way — one of them a verification step that passed
  # without verifying anything.
  pull_request:

# Required to force-push the built site to gh-pages. PR runs never reach the
# publish step, and pull_request from a fork gets a read-only token regardless.
permissions:
  contents: write

concurrency:
  # PRs get their own group so a dry run can never queue behind, or cancel, a
  # scheduled publish.
  group: >-
    ${{ github.event_name == 'pull_request'
        && format('basemap-dryrun-{0}', github.ref)
        || 'publish-basemap' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs node, python, uv and the pmtiles CLI from mise.toml/mise.lock.
      # build.sh calls `mise install` itself too, so this mostly serves to cache
      # them across runs.
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Install tippecanoe
        # Tiles Carleton's campus layers and joins them into the basemap.
        # build.sh fetches the rest of its toolchain itself, but tippecanoe is a
        # C++ build and the distro package is both current and instant.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tippecanoe
          tippecanoe --version

      - name: Build
        run: ./build.sh

      - name: Check the tiles are not gzipped
        # Pages will not set Content-Encoding on a .pbf, so a gzipped tile would
        # reach the app as garbage. This is the failure that is hardest to spot
        # on device, so it is worth asserting in CI rather than trusting.
        run: |
          bad=0
          while IFS= read -r f; do
            if [ "$(head -c 2 "$f" | od -An -tx1 | tr -d ' \n')" = "1f8b" ]; then
              echo "gzipped tile: $f"
              bad=1
            fi
          done < <(find dist/tiles -name '*.pbf')
          [ "$bad" = 0 ] || exit 1
          echo "OK: $(find dist/tiles -name '*.pbf' | wc -l) tiles stored uncompressed"

      # build.sh already runs scripts/verify.py, which cross-checks the styles
      # against the tileset's schema and the vendored fonts and sprites. Those
      # are the mismatches that render a blank map without erroring.

      - name: Summarise the build
        # On a PR this is the payoff: the numbers that would have been published,
        # visible in the run summary without anything being published.
        run: |
          {
            echo "| | |"
            echo "| --- | ---: |"
            echo "| campus.pmtiles | $(numfmt --to=iec --suffix=B "$(wc -c < dist/campus.pmtiles)") |"
            echo "| tiles | $(find dist/tiles -name '*.pbf' | wc -l) files |"
            echo "| glyph ranges | $(find dist/fonts -name '*.pbf' | wc -l) |"
            echo "| style layers | $(python3 -c 'import json;print(len(json.load(open("dist/style.json"))["layers"]))') |"
            echo "| source-layers | $(python3 -c 'import json;print(len({l["source-layer"] for l in json.load(open("dist/style.json"))["layers"] if "source-layer" in l}))') |"
            echo
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "Dry run — nothing published."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to gh-pages
        if: github.event_name != 'pull_request'
        # Force-push a single fresh commit. This branch is entirely owned by this
        # workflow and there is nothing on it to preserve; without the force-push
        # every rebuild would add another multi-megabyte blob to history forever.
        run: |
          cd dist
          git init --quiet -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Build basemap from ${GITHUB_SHA::7} ($(date -u +%Y-%m-%d))"
          git push --force --quiet \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            gh-pages
          echo "Published $(find . -type f | wc -l) files to gh-pages"

      - name: Verify the published site
        if: github.event_name != 'pull_request'
        # Pages takes a minute or two to pick up the push. Checking the live
        # site is what catches the whole class of "the build was fine but the
        # thing the app fetches is not".
        run: |
          base="https://carls-app.github.io/map-tiles"
          want=$(sha256sum dist/campus.pmtiles | cut -d' ' -f1)

          # Wait until Pages is serving *this* build. Waiting for a 200 is not
          # enough: the previous deployment answers 200 for the whole window, so
          # every check below would pass against stale content and prove nothing
          # about what was just pushed.
          got=""
          for i in $(seq 1 20); do
            got=$(curl -sS "$base/campus.pmtiles" | sha256sum | cut -d' ' -f1)
            [ "$got" = "$want" ] && break
            echo "waiting for Pages to serve this build ($i/20)"
            sleep 30
          done
          if [ "$got" != "$want" ]; then
            echo "Pages never served this build — wanted $want, still getting $got"
            exit 1
          fi
          echo "Pages is serving this build ($want)"

          fail=0
          check() { # url label
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$1")
            echo "  $code  $2"
            [ "$code" = "200" ] || fail=1
          }

          # Probe a deepest-zoom tile, rather than hardcoding a path that a bbox
          # change would invalidate. awk consumes the whole stream; `head -1`
          # would close the pipe early and make sort report a broken pipe.
          tile=$(cd dist && find tiles -name '*.pbf' |
            awk -F/ '{ if ($2 + 0 >= z) { z = $2 + 0; t = $0 } } END { print t }')

          echo "reachability:"
          check "$base/style.json" "style.json"
          check "$base/style-pmtiles.json" "style-pmtiles.json"
          check "$base/campus.pmtiles" "campus.pmtiles"
          check "$base/$tile" "$tile"
          check "$base/sprites/sprite.json" "sprites/sprite.json"
          check "$base/sprites/sprite@2x.png" "sprites/sprite@2x.png"

          # Every fontstack, not just one: a style names three, and a missing
          # stack renders that text with no labels and no error. Fed by process
          # substitution, not a pipe, so `fail` survives the loop.
          while IFS= read -r glyph; do
            check "$base/$(printf '%s' "$glyph" | sed 's/ /%20/g')" "$glyph"
          done < <(cd dist && find fonts -name '0-255.pbf' | sort)

          # A tile must arrive raw. If Pages ever started gzipping these, or a
          # future change stored them compressed, the app would get garbage.
          if curl -sS -D - -o /dev/null "$base/$tile" | grep -qi '^content-encoding:'; then
            echo "  FAIL: served tile has a Content-Encoding header"; fail=1
          fi

          # Range support is what style-pmtiles.json depends on. Note this must
          # be a GET: a HEAD (curl -I) returns 200 and no Content-Range, which
          # looks like Range is unsupported when it is not.
          echo "range request (GET, not HEAD):"
          headers=$(curl -sS -r 0-99 -D - -o /dev/null "$base/campus.pmtiles")
          echo "$headers" | grep -Ei '^(HTTP|accept-ranges|content-range|content-length)' | sed 's/^/  /'
          if echo "$headers" | grep -qi '206 Partial Content\|^content-range:'; then
            echo "  Range requests honoured"
          else
            echo "  WARNING: no 206/Content-Range — style-pmtiles.json will not work"
            echo "  (style.json is unaffected; it does not use range requests)"
          fi

          [ "$fail" = 0 ] || { echo "published site verification failed"; exit 1; }
