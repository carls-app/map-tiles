name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # The interpreter comes from .python-version, and the tools from uv.lock,
      # so CI runs exactly what a local `uv run` does.
      - run: uv sync --locked
      - name: ruff check
        run: uv run ruff check --output-format=github scripts/
      - name: ruff format
        run: uv run ruff format --check --diff scripts/

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: oxlint
        run: npx oxlint --format=github scripts/
      - name: oxfmt
        run: npx oxfmt --check scripts/

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        # build.sh is the whole pipeline and runs unattended on a schedule, so an
        # unquoted expansion or a typo'd variable is a silent bad publish.
        run: shellcheck build.sh

  actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        # Every workflow bug in this repo so far only surfaced when a run
        # actually happened, which needed a merge. This catches the static half.
        run: |
          # renovate: datasource=github-releases depName=rhysd/actionlint
          ACTIONLINT_VERSION="1.7.7"

          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar xzf actionlint.tar.gz actionlint
          ./actionlint -color
