name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      # The interpreter comes from mise.toml/mise.lock and the packages from
      # uv.lock, so CI runs exactly what a local `mise install` gives you.
      - run: uv sync --locked
      - name: ruff check
        run: uv run ruff check --output-format=github scripts/
      - name: ruff format
        run: uv run ruff format --check --diff scripts/

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - run: npm ci
      - name: oxlint
        run: npx oxlint --format=github scripts/
      - name: oxfmt
        run: npx oxfmt --check scripts/

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - name: shellcheck
        # build.sh is the whole pipeline and runs unattended on a schedule, so an
        # unquoted expansion or a typo'd variable is a silent bad publish.
        run: shellcheck build.sh

  actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - name: actionlint
        # Every workflow bug in this repo so far only surfaced when a run
        # actually happened, which needed a merge. This catches the static half.
        run: actionlint -color
