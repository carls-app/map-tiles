# One place for every tool version this repo needs, with mise.lock recording the
# exact URL and sha256 per platform. CI installs from it with jdx/mise-action;
# locally `mise install` gets you the same versions.
#
# Not here: tippecanoe. It has no prebuilt releases — it is a C++ build — so it
# stays a system package. build.sh checks for it and says how to install it.

[settings]
lockfile = true

[tools]
python = "3.14"
node = "26"

# Resolves the Python interpreter and the locked packages for the build scripts.
uv = "0.12.3"

# Linting. Both are single static binaries, which is why they belong here rather
# than in a package manifest.
shellcheck = "0.11.0"
actionlint = "1.7.7"

# The PMTiles CLI: does the planet extract and the MBTiles→PMTiles conversion.
"github:protomaps/go-pmtiles" = { version = "1.28.0", exe = "pmtiles" }
