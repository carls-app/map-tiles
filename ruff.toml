# The scripts here are short and comment-heavy, and the comments carry most of
# the reasoning. 100 columns keeps prose readable without forcing awkward wraps
# in the middle of an explanation.
line-length = 100

[lint]
extend-select = [
  "I",    # import sorting
  "UP",   # pyupgrade — these run on 3.9+, no reason to write older Python
  "B",    # bugbear
  "SIM",  # simplify
]

[lint.per-file-ignores]
# The scripts are CLIs, not a library; printing is the interface.
"scripts/*.py" = ["T201"]
